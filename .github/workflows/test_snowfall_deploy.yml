name: Terraform Multi-Stage Deployment

on:
  push:
    branches:
      - dev-test
      - main-test
    tags:
      - '*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install boto3
        run: pip install boto3

      - name: Set Environment Variables
        run: |
          BRANCH="${{ github.ref_name }}"
          IS_TAG="${{ startsWith(github.ref, 'refs/tags/') }}"
          if [[ "$BRANCH" == "dev-test" ]]; then
            echo "ENV=dev" >> $GITHUB_ENV
            echo "TFVARS=dev.tfvars" >> $GITHUB_ENV
          elif [[ "$IS_TAG" == "true" ]]; then
            echo "ENV=prod" >> $GITHUB_ENV
            echo "TFVARS=prod.tfvars" >> $GITHUB_ENV
          else
            echo "ENV=nprod" >> $GITHUB_ENV
            echo "TFVARS=nprod.tfvars" >> $GITHUB_ENV
          fi

      - name: Load AWS Role and State Bucket
        run: |
          VAR_FILE="terraform/${{ env.TFVARS }}"
          AWS_ROLE_TO_ASSUME=$(grep 'aws_role_to_assume' "$VAR_FILE" | cut -d '=' -f2 | tr -d ' "')
          STATE_BUCKET=$(grep 'terraform_bucket_name' "$VAR_FILE" | cut -d '=' -f2 | tr -d ' "')
          echo "AWS_ROLE_TO_ASSUME=$AWS_ROLE_TO_ASSUME" >> $GITHUB_ENV
          echo "STATE_BUCKET=$STATE_BUCKET" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHubActions

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v1
        with:
          terraform_version: 1.7.4

      - name: Detect Changed Terraform Folders
        id: detect
        run: |
          echo "Detecting changed folders..."
          CHANGED=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} \
            | grep '^terraform/' \
            | grep '.tf' \
            | awk -F/ '{print $2}' \
            | sort -u)
          echo "changed_folders<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Deploy Terraform Modules
        run: |
          BRANCH="${{ github.ref_name }}"
          IS_TAG="${{ startsWith(github.ref, 'refs/tags/') }}"
          CHANGED="${{ steps.detect.outputs.changed_folders }}"

          echo "Changed folders:"
          echo "$CHANGED"

          if [[ "$BRANCH" == "dev-test" ]]; then
            echo "Selective deployment for dev-test"
            while IFS= read -r stage; do
              echo "Deploying $stage to Dev"
              cd terraform/$stage
              terraform init -backend-config="bucket=${{ env.STATE_BUCKET }}"
              terraform plan -var-file=../${{ env.TFVARS }} -out=tfplan

              cd -
            done <<< "$CHANGED"

          elif [[ "$BRANCH" == "main-test" && "$IS_TAG" == "false" ]]; then
            echo "Full deployment to Non-Prod"
            for stage in core_delta_lake glue_resources other_resources datashare_resources; do
              echo "Deploying $stage to Non-Prod"
              cd terraform/$stage
              terraform init -backend-config="bucket=${{ env.STATE_BUCKET }}"
              terraform plan -var-file=../${{ env.TFVARS }} -out=tfplan
              echo "Manual approval required for $stage in Non-Prod"
              exit 1
              cd -
            done

          elif [[ "$IS_TAG" == "true" ]]; then
            echo "Tagged release — deploying to Prod"
            for stage in core_delta_lake glue_resources other_resources datashare_resources; do
              echo "Deploying $stage to Prod"
              cd terraform/$stage
              terraform init -backend-config="bucket=${{ env.STATE_BUCKET }}"
              terraform plan -var-file=../${{ env.TFVARS }} -out=tfplan
              echo "Manual approval required for $stage in Prod"
              exit 1
              cd -
            done
          fi
