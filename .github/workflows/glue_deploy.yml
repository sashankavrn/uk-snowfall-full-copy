name: Glue Workflow Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        options:
          - dev
          - nprod
          - prod

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ENVIRONMENT: ${{ github.event.inputs.environment }}
  VAR_FILE: ${{ github.event.inputs.environment == 'dev' && '../dev.tfvars'
    || github.event.inputs.environment == 'nprod' && '../nprod.tfvars'
    || github.event.inputs.environment == 'prod' && '../prod.tfvars' }}

concurrency:
  group: ${{ github.event.inputs.environment == 'dev' && 'deploy-development'
    || github.event.inputs.environment == 'nprod' && 'deploy-nprod'
    || github.event.inputs.environment == 'prod' && 'deploy-production'
    || 'default' }}
  cancel-in-progress: true

jobs:
  terraform_plan:
    # Run plan & approval only for prod, same as before but driven by the dispatch input
    if: ${{ github.event.inputs.environment == 'prod' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: initialise
        uses: ./.github/composite/initialise_job

      - name: Load AWS Role and State Bucket
        id: load_env
        run: |
          echo "Loading AWS_ROLE_TO_ASSUME and STATE_BUCKET from VAR_FILE_AWS..."
          VAR_FILE_AWS="${{ github.event.inputs.environment == 'dev' && 'terraform/dev.tfvars'
            || github.event.inputs.environment == 'nprod' && 'terraform/nprod.tfvars'
            || github.event.inputs.environment == 'prod' && 'terraform/prod.tfvars' }}"
          AWS_ROLE_TO_ASSUME=$(grep 'aws_role_to_assume' "$VAR_FILE_AWS" | cut -d '=' -f2 | tr -d ' "')
          STATE_BUCKET=$(grep 'terraform_bucket_name' "$VAR_FILE_AWS" | cut -d '=' -f2 | tr -d ' "')
          echo "AWS_ROLE_TO_ASSUME=$AWS_ROLE_TO_ASSUME" >> $GITHUB_ENV
          echo "STATE_BUCKET=$STATE_BUCKET" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHubActions
          web-identity-token-file: ${{ steps.oidc-token.outputs.token }}

      - name: Running the Glue Resources Stage
        run: |
          cd terraform/glue_resources
          terraform init -backend-config="bucket=${{ env.STATE_BUCKET }}"
          terraform plan -var-file=${{ env.VAR_FILE }} -out=tfplan
        env:
          AWS_REGION: ${{ env.AWS_REGION }}

      - name: Running the Other Resources Stage
        run: |
          cd terraform/other_resources
          terraform init -backend-config="bucket=${{ env.STATE_BUCKET }}"
          terraform plan -var-file=${{ env.VAR_FILE }} -out=tfplan
        env:
          AWS_REGION: ${{ env.AWS_REGION }}

  request_approval:
    # Approval gate only required for prod
    if: ${{ github.event.inputs.environment == 'prod' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: Approvers
    needs: terraform_plan
    steps:
      - name: Waiting on approval
        run: echo "Waiting on approval"

  terraform_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: [terraform_plan, request_approval]
    # Count "Skipped" as success so non-prod goes straight to deploy (same behavior)
    if: ${{ always() && !failure() && !cancelled() }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2

      - name: initialise
        uses: ./.github/composite/initialise_job

      - name: Load AWS Role and State Bucket
        id: load_env
        run: |
          echo "Loading AWS_ROLE_TO_ASSUME and STATE_BUCKET from VAR_FILE_AWS..."
          VAR_FILE_AWS="${{ github.event.inputs.environment == 'dev' && 'terraform/dev.tfvars'
            || github.event.inputs.environment == 'nprod' && 'terraform/nprod.tfvars'
            || github.event.inputs.environment == 'prod' && 'terraform/prod.tfvars' }}"
          AWS_ROLE_TO_ASSUME=$(grep 'aws_role_to_assume' "$VAR_FILE_AWS" | cut -d '=' -f2 | tr -d ' "')
          STATE_BUCKET=$(grep 'terraform_bucket_name' "$VAR_FILE_AWS" | cut -d '=' -f2 | tr -d ' "')
          echo "AWS_ROLE_TO_ASSUME=$AWS_ROLE_TO_ASSUME" >> $GITHUB_ENV
          echo "STATE_BUCKET=$STATE_BUCKET" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          role-session-name: GitHubActions
          web-identity-token-file: ${{ steps.oidc-token.outputs.token }}

      - name: Running the Glue Resources Stage
        run: |
          cd terraform/glue_resources
          terraform init -backend-config="bucket=${{ env.STATE_BUCKET }}"
          terraform plan -var-file=${{ env.VAR_FILE }} -out=tfplan
          terraform apply -auto-approve tfplan
        env:
          AWS_REGION: ${{ env.AWS_REGION }}

      - name: Running the Other Resources Stage
        run: |
          cd terraform/other_resources
          terraform init -backend-config="bucket=${{ env.STATE_BUCKET }}"
          terraform plan -var-file=${{ env.VAR_FILE }} -out=tfplan
          terraform apply -auto-approve tfplan
        env:
          AWS_REGION: ${{ env.AWS_REGION }}