name: 'PR Enhancer'
on:
  pull_request:
    branches:
      - dev
      - main
    types: [opened, synchronize]
    
env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ENVIRONMENT: ${{ github.ref == 'refs/heads/dev' && 'dev' ||
      github.ref == 'refs/heads/main' && 'prod' }}
  VAR_FILE: ${{ github.ref == 'refs/heads/dev' && '../dev.tfvars' ||
      startsWith(github.ref, 'refs/tags/v') && '../prod.tfvars' }}

jobs:
  attach_tf_plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v2
    
      - name: Initialise
        uses: ./.github/composite/initialise_job
        
      - name: Terraform Plan
        run: |
          terraform init -backend-config="bucket=${{ env.STATE_BUCKET }}"
          terraform plan -var-file=${{ env.VAR_FILE }} -no-color
        continue-on-error: true
        
      - name: Comment PR
        uses: actions/github-script@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Format and Style 🖌\`${{ steps.fmt.outputs.stdout }}\`
            #### Terraform Initialization ⚙️\`${{ steps.init.outputs.stdout }}\`
            #### Terraform Plan 📖\`${{ steps.plan.outputs.stdout }}\``;
            github.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform checks in directory '${{ matrix.directory }}'\n` + output
            })
